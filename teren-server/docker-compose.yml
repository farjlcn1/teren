# Teren na strežniku: aplikacija (Next.js) + API (Spring Boot), baza na 192.168.0.30:5433.
#
#   docker compose up -d --build              # zagon (api → teren)
#   docker compose logs api | grep "prvi admin"  # geslo prvega admina (samo ob prvem zagonu na prazni bazi)
#   docker compose --profile tunnel up -d     # + Cloudflare tunel za teren.farjolcn.com
#
# Do baze dostopa samo API (DB_* v .env). Ob zagonu Flyway ustvari shemo v prazni bazi, bazo iz Prisme
# (stara aplikacija teren) pa brez sprememb označi kot izhodišče; neznane neprazne baze ne spreminja.
name: teren

services:
  api:
    build: ./teren-api
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:?manjka DB_HOST v .env}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?manjka DB_NAME v .env}
      DB_USERNAME: ${DB_USER:?manjka DB_USER v .env}
      DB_PASSWORD: ${DB_PASSWORD:?manjka DB_PASSWORD v .env}
      API_PUBLIC_URL: http://localhost:8080
      API_TOKEN: ${API_TOKEN:?manjka API_TOKEN v .env}
      # Na prazni bazi API ob zagonu ustvari admina s tem emailom in geslo izpiše v log.
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      APP_LOG_LEVEL: ${API_LOG_LEVEL:-DEBUG}
      # Swagger UI in OpenAPI opis v produkciji nista potrebna.
      API_DOCS_ENABLED: "false"
      TZ: Europe/Ljubljana
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    mem_limit: 768m
    # Brez ports: API je dosegljiv samo aplikaciji teren po Docker omrežju.
    # Za Swagger s strežnika začasno dodaj: ports: ["127.0.0.1:8080:8080"]
    volumes:
      - api_logs:/app/logs

  teren:
    build: ./teren
    restart: unless-stopped
    depends_on:
      # Aplikacija vse podatke bere in piše prek API-ja.
      api:
        condition: service_healthy
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?manjka SESSION_SECRET v .env}
      UPLOADS_DIR: /app/uploads
      NEXT_PUBLIC_APP_URL: ${APP_URL:-https://teren.farjolcn.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Teren kliče API po internem Docker omrežju in se predstavi z API_TOKEN.
      API_URL: http://api:8080
      API_TOKEN: ${API_TOKEN:?manjka API_TOKEN v .env}
      # Brez tega vsebnik teče v UTC, koledar v /plan pa bi pri SSR računal napačne ure.
      TZ: Europe/Ljubljana
    ports:
      # Samo za dostop s strežnika (curl, reverse proxy). Tunel gre na teren:3000 po Docker omrežju.
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Javni dostop prek Cloudflare tunela (teren.farjolcn.com -> http://teren:3000).
  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Neobvezen, da manjkajoč žeton ne blokira zagona ostalih servisov (brez --profile tunnel).
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      teren:
        condition: service_healthy

volumes:
  uploads:
  api_logs:
