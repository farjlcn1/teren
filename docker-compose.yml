services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: teren
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: teren
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teren"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://teren:${POSTGRES_PASSWORD}@postgres:5432/teren
      UPLOADS_DIR: /app/uploads
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - /home/matija/teren-data/uploads:/app/uploads

volumes:
  postgres_data:
