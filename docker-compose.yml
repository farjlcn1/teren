# Testno okolje Teren: aplikacija (Next.js) + API (Spring Boot) + lokalna testna baza.
#
#   docker compose up -d --build              # zagon (db → api → teren)
#   docker compose logs api | grep "prvi admin"  # geslo prvega admina (samo ob prvem zagonu na prazni bazi)
#   docker compose --profile tunnel up -d     # + Cloudflare tunel za teren.farjolcn.com
#
# Do baze dostopa samo API, ki ob zagonu z Flywayem ustvari ali posodobi shemo.
# Za strežnik z zunanjo bazo je pripravljen teren-server/docker-compose.yml (glej README.md).
name: teren

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: teren
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?manjka POSTGRES_PASSWORD v .env}
      POSTGRES_DB: teren
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      # Samo za pregled baze z orodji na tem računalniku (npr. DBeaver), od zunaj ni dosegljiva.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teren -d teren"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./teren-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: teren
      DB_USERNAME: teren
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      API_PUBLIC_URL: http://localhost:8080
      API_TOKEN: ${API_TOKEN:?manjka API_TOKEN v .env}
      # Na prazni bazi API ob zagonu ustvari admina s tem emailom in geslo izpiše v log.
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      APP_LOG_LEVEL: ${API_LOG_LEVEL:-DEBUG}
      TZ: Europe/Ljubljana
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    mem_limit: 768m
    ports:
      # Za Swagger med testiranjem (http://localhost:8080/swagger-ui.html). V produkciji se izpusti.
      - "127.0.0.1:8080:8080"
    volumes:
      - api_logs:/app/logs

  teren:
    build: ./teren
    restart: unless-stopped
    depends_on:
      # Aplikacija vse podatke bere in piše prek API-ja.
      api:
        condition: service_healthy
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?manjka SESSION_SECRET v .env}
      UPLOADS_DIR: /app/uploads
      NEXT_PUBLIC_APP_URL: ${APP_URL:-https://teren.farjolcn.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Teren kliče API po internem Docker omrežju in se predstavi z API_TOKEN.
      API_URL: http://api:8080
      API_TOKEN: ${API_TOKEN:?manjka API_TOKEN v .env}
      # Brez tega vsebnik teče v UTC, koledar v /plan pa bi pri SSR računal napačne ure.
      TZ: Europe/Ljubljana
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Javni dostop prek Cloudflare tunela (teren.farjolcn.com -> http://teren:3000).
  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Neobvezen, da manjkajoč žeton ne blokira zagona ostalih servisov (brez --profile tunnel).
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      teren:
        condition: service_healthy

volumes:
  db_data:
  uploads:
  api_logs:
