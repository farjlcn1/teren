# Vse vrednosti, ki se razlikujejo med okolji, se preberejo iz okoljskih spremenljivk
# (v Dockerju jih nastavi docker-compose.yml). Privzete vrednosti so za lokalni razvoj.
spring:
  application:
    name: teren-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:teren}
    username: ${DB_USERNAME:teren}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Shemo zaenkrat ustvarja Prisma (aplikacija teren); API jo ob zagonu samo preveri.
      ddl-auto: validate
      naming:
        # Prisma stolpce poimenuje v camelCase z narekovaji ("createdAt"), zato brez pretvorbe v snake_case.
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        globally_quoted_identifiers: true
        jdbc:
          # Prisma hrani čase kot TIMESTAMP(3) brez časovnega pasu, v UTC.
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP

server:
  port: ${SERVER_PORT:8080}
  # Za reverse proxy / Cloudflare tunel (pravilni URL-ji v Location glavah).
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}

teren:
  api:
    public-url: ${API_PUBLIC_URL:http://localhost:8080}
    # Skupni žeton z aplikacijo Teren (Authorization: Bearer ...). Brez njega se API ne zažene.
    token: ${API_TOKEN:}
    # Dan naloga (dnevna številka DDMMLLLLNNN) se določi po tem časovnem pasu.
    time-zone: ${APP_TIME_ZONE:Europe/Ljubljana}

# Pot do zunanje konfiguracije logiranja se lahko poda z LOGGING_CONFIG=/pot/do/logback.xml
logging:
  file:
    path: ${LOG_PATH:logs}
  level:
    com.sledenje.teren: ${APP_LOG_LEVEL:DEBUG}
